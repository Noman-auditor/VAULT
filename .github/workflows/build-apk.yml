name: 📦 Build Nora Tunnel APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build-web:
    name: 🌐 Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Upload Dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    needs: build-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web Dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Initialize Capacitor
        run: |
          npx cap sync android --deployment
          npx cap copy android

      - name: Verify Android Project
        run: |
          ls -la android/
          ls -la android/app/
          ls -la android/app/src/main/
          ls -la android/app/src/main/java/com/nora/tunnel/

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Parm64only=false

      - name: Rename Debug APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/nora-tunnel-v1.0.0-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nora-tunnel-v1.0.0-debug
          path: android/app/build/outputs/apk/debug/nora-tunnel-v1.0.0-debug.apk
          retention-days: 90

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.ref == 'refs/heads/main'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Parm64only=false
        continue-on-error: true

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nora-tunnel-v1.0.0-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
        continue-on-error: true

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🛡️ NORA TUNNEL — APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **App** | NORA TUNNEL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.nora.tunnel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | 1.0.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Min SDK** | 29 (Android 10) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target SDK** | 34 (Android 14) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Architecture** | ARM64 + ARM |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java** | 17 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gradle** | 8.5 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Downloads" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. 🐛 **Debug APK:** Download \`nora-tunnel-v1.0.0-debug\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "2. 🚀 **Release APK:** Download \`nora-tunnel-v1.0.0-release-unsigned\` artifact (if built)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📲 Install on Android" >> $GITHUB_STEP_SUMMARY
          echo "1. Download APK from workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer to your Android device" >> $GITHUB_STEP_SUMMARY
          echo "3. Enable **Install from unknown sources** in Settings" >> $GITHUB_STEP_SUMMARY
          echo "4. Open and install the APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Security" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK: Signed with debug key (development only)" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: Unsigned — must be signed before distribution" >> $GITHUB_STEP_SUMMARY
          echo "- No test credentials, no fake servers, no hidden telemetry" >> $GITHUB_STEP_SUMMARY

  # Create a GitHub Release with APK on main branch pushes
  create-release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: nora-tunnel-v1.0.0-debug
          path: apk/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: NORA TUNNEL v1.0.0 Build ${{ github.run_number }}
          body: |
            🛡️ **NORA TUNNEL** — Secure. Private. Connected.

            ## Changes
            Automated build from commit ${{ github.sha }}

            ## APK
            - 📱 **nora-tunnel-v1.0.0-debug.apk** — Debug build for testing
            - 🎯 **Target:** Android 10+ (API 29+)
            - 📦 **Package:** com.nora.tunnel

            ## Install
            1. Download APK
            2. Enable "Install from unknown sources"
            3. Install on your Android device
          files: |
            apk/nora-tunnel-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
